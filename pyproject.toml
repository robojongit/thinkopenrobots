[project]
name = "inkling-robo"
version = "0.1.0"
description = "Open leaderboard for robot harnesses built on Inkling 2 Mini"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = ["msgpack>=1.0", "numpy>=1.26"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "harness", "sdk/inkling_robo"]
exclude = ["harness/capx"]  # the CaP-X submodule is installed by the sim group, not shipped

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4"]
# The local simulator: CaP-X from the harness/capx submodule (and its RoboSuite submodule).
# Only the trusted harness imports it; the project's own dependencies, which are all the
# participant SDK (sdk/inkling_robo) needs, stay msgpack + numpy.
sim = ["capx"]

[tool.uv]
default-groups = ["dev", "sim"]
# CaP-X's own lock pins these with overrides; uv applies only the root project's overrides.
override-dependencies = [
    "numpy==1.26.4",
    "jax<0.4.30",
    "jaxlib<0.4.30",
    "ml-dtypes<0.6",
    "PyOpenGL==3.1.6",
    "PyOpenGL-accelerate==3.1.6",
    "opencv-python-headless<4.13",
    "opencv-python ; sys_platform == 'never'",
]

[tool.uv.sources]
capx = { path = "harness/capx", editable = true }

[tool.ruff]
line-length = 100
extend-exclude = ["harness/capx"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["harness/tests", "bench/tests", "sdk/tests", "site/tests", "tests"]
pythonpath = [".", "sdk"]
# Tests marked `sim` need the real simulator and take minutes; tests marked `container` need
# Docker and the agent image. The default run skips both. Run them with `uv run pytest -m sim`
# or `-m container` (a later -m overrides this one).
addopts = "-m 'not sim and not container'"
markers = [
    "sim: needs the real simulator (CaP-X + RoboSuite) and a PyRoKi IK server",
    "container: needs Docker and the agent image (docker/agent/build.sh)",
]
